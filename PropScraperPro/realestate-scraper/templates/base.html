<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropScraper Pro {% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <span class="nav-logo">⬡</span>
    <span class="nav-title">PropScraper<span class="nav-pro">Pro</span></span>
  </div>
  <div class="nav-links">
    <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint=='index' %}active{% endif %}">Home</a>
    <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint=='dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{{ url_for('scraper') }}" class="nav-link {% if request.endpoint=='scraper' %}active{% endif %}">Scraper</a>
    <a href="{{ url_for('listings') }}" class="nav-link {% if request.endpoint=='listings' %}active{% endif %}">Listings</a>
    <a href="{{ url_for('admin') }}" class="nav-link nav-admin {% if request.endpoint=='admin' %}active{% endif %}">Admin</a>
  </div>
</nav>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>PropScraper Pro &copy; 2025</span>
  <span class="footer-note">Publicly listed data only · GDPR aware · robots.txt compliant</span>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
